name: Deploy Web (pygbag)

on:
  push:
    branches: [main, master]
    paths:
      - 'main.py'
      - 'game/**'
      - 'assets/**'
      - 'requirements.txt'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pygbag
        run: python -m pip install pygbag

      - name: Build web bundle
        run: python -m pygbag --archive .

      - name: Prepare web root
        run: |
          mkdir -p _site
          cp build/web/index.html _site/
          cp build/web/favicon.png _site/
          cp build/web/*.tar.gz _site/
          ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
