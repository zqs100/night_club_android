name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtirpc-dev \
            libssl-dev libffi-dev libsqlite3-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.37" buildozer

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
            bin
          key: ${{ runner.os }}-buildozer-v2-${{ hashFiles('buildozer.spec', '.github/workflows/build-android.yml') }}


      - name: Build debug APK
        shell: bash
        run: |
          set +o pipefail
          # p4a 的 hostpython3==3.11.9 是隔离构建，pygame 的 setup.py 用它编译时
          # 需要能 import Cython；而 requirements 里的 cython recipe 只装到了
          # Android 目标环境(hostpython 看不到)。这里把系统 Python(同为 cp311,
          # Cython 0.29.x 为纯 Python) 的 site-packages 通过 PYTHONPATH 暴露给
          # hostpython，彻底解决 "You need cython"。
          SYS_SITE_PACKAGES="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          export PYTHONPATH="$SYS_SITE_PACKAGES${PYTHONPATH:+:$PYTHONPATH}"
          python -c 'import Cython; print("Cython", Cython.__version__, "from", Cython.__file__)'
          yes | buildozer android debug
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit $status

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightclub-v1.0.0.1-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
