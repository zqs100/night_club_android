name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtirpc-dev \
            libssl-dev libffi-dev libsqlite3-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3" buildozer

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
            bin
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build debug APK
        shell: bash
        run: |
          set +o pipefail
          yes | buildozer android debug
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit $status

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightclub-v1.0.0.1-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
