name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtirpc-dev \
            libssl-dev libffi-dev libsqlite3-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython>=3.0,<3.1" buildozer

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
            bin
          key: ${{ runner.os }}-buildozer-v4-${{ hashFiles('buildozer.spec', '.github/workflows/build-android.yml', 'p4a-recipes/**') }}


      - name: Build debug APK
        shell: bash
        run: |
          set +o pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          yes | buildozer android debug
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit $status

      - name: Diagnose build failure
        if: failure()
        shell: bash
        run: |
          echo "===== DIAG: generated build.gradle files ====="
          find .buildozer -path '*/dists/*/build.gradle' -type f 2>/dev/null | while read -r f; do
            echo "-------- $f --------"
            nl -ba "$f"
          done
          echo "===== DIAG: project.properties ====="
          find .buildozer -name 'project.properties' -type f 2>/dev/null | while read -r f; do
            echo "-------- $f --------"
            cat "$f"
          done
          echo "===== DIAG: gradle stacktrace rerun ====="
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          export PATH="$JAVA_HOME/bin:$PATH"
          for d in $(find .buildozer -type d -path '*/dists/*' 2>/dev/null); do
            if [ -f "$d/gradlew" ]; then
              echo "-------- gradlew --stacktrace in $d --------"
              (cd "$d" && ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tail -120) || true
              break
            fi
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightclub-v1.0.0.1-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
